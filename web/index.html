<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Skogsälva — Mood Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,300;1,6..72,400&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="assets/board.css">
</head>
<body>

<div id="app">

  <div id="bar">
    <span class="brand">Skogs<em>älva</em></span>

    <button id="toggle-tray" class="on" title="Show or hide the photo tray">Photos</button>

    <span class="sep"></span>

    <button id="add-text" title="Add a text block">+ Text</button>
    <button id="add-swatch" title="Add a colour palette">+ Palette</button>
    <button id="arrange" title="Tidy everything into a grid">Auto-arrange</button>

    <span class="sep"></span>

    <button id="undo" class="ghost" title="Undo (Ctrl+Z)">↶</button>
    <button id="redo" class="ghost" title="Redo (Ctrl+Shift+Z)">↷</button>

    <span class="sep"></span>
    <span class="grounds" id="grounds" title="Board background"></span>

    <span class="grow"></span>

    <span class="zoom">
      <button id="zout" class="ghost" title="Zoom out">−</button>
      <span id="zlabel">100%</span>
      <button id="zin" class="ghost" title="Zoom in">+</button>
      <button id="zfit" class="ghost" title="Fit to window">Fit</button>
    </span>

    <span class="sep"></span>

    <button id="png" title="Download the board as an image">Download PNG</button>
    <button id="json" title="Save the board to a file you can send on">Export</button>
    <button id="import" title="Load a board someone sent you">Import</button>
    <button id="reset" class="ghost danger" title="Back to the default arrangement">Reset</button>

    <input type="file" id="import-file" accept="application/json,.json" hidden>
    <input type="file" id="upload-file" accept="image/*" multiple hidden>
  </div>

  <div id="pagebar-wrap">
    <span class="pb-label">Boards</span>
    <div id="pagebar"></div>
    <span class="grow"></span>
    <span class="pb-label">Canvas</span>
    <span id="sizes"></span>
  </div>

  <div id="body">

    <aside id="tray">
      <div class="tray-head">
        <h2>Photo tray</h2>
        <p>Click one to drop it on the board.</p>
      </div>
      <div class="tray-list" id="tray-list"></div>
      <div class="tray-foot">
        <button class="filebtn" id="upload">+ Upload photos</button>
        <div class="meter" id="meter" title="Uploaded photos are stored in this browser">
          <div class="meter-bar"><i id="meter-fill"></i></div>
          <span id="meter-text"></span>
        </div>
        <p class="hint">Or drag image files anywhere onto the page.</p>
      </div>
      <div id="tray-grip" role="separator" aria-orientation="vertical" tabindex="0"
           aria-label="Drag to resize the photo tray" title="Drag to resize · double-click to reset"></div>
    </aside>

    <div id="stage">
      <div id="scroller">
        <div id="pagewrap">
          <div id="page"></div>
        </div>
      </div>
    </div>

  </div>
</div>

<div id="actions" hidden></div>

<div id="cropper" hidden>
  <div class="crop-head">
    <span class="pb-label">Crop</span>
    <span id="crop-title"></span>
    <span class="grow"></span>
    <span class="pb-label">Ratio</span>
    <span id="crop-aspects"></span>
    <span class="sep"></span>
    <button id="crop-reset" class="ghost">Reset</button>
    <button id="crop-cancel" class="ghost">Cancel</button>
    <button id="crop-apply" class="on">Apply</button>
  </div>
  <div class="crop-stage" id="crop-stage">
    <img id="crop-img" alt="">
    <div id="crop-shade"></div>
    <div id="crop-rect">
      <span class="ch nw" data-ch="nw"></span>
      <span class="ch ne" data-ch="ne"></span>
      <span class="ch sw" data-ch="sw"></span>
      <span class="ch se" data-ch="se"></span>
    </div>
  </div>
</div>

<div id="toast" hidden></div>
<div id="drop" hidden>Drop photos onto the board</div>

<script src="assets/data.js"></script>
<script src="assets/board.js"></script>
</body>
</html>
